name: Status joylash

on:
  schedule:
    # Toshkent vaqti (UTC+5): 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 19:30, 21:00, 22:30
    - cron: "0 3 * * *"
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      faqat_test:
        description: "Faqat video yasash (Instagramga joylamasdan)"
        type: boolean
        default: true

concurrency:
  group: joyla
  cancel-in-progress: false

jobs:
  joyla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Agentni ishga tushirish
        run: python agent.py ${{ (github.event_name == 'workflow_dispatch' && inputs.faqat_test) && '--test' || '--now' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          VIDEO_REPO: ${{ secrets.VIDEO_REPO }}
          VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
      - name: Videoni saqlab qo'yish (ko'rish uchun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: chiqish/*.mp4
          retention-days: 3
          if-no-files-found: ignore
