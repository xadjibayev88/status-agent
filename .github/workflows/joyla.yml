name: Status joylash

on:
  schedule:
    # 2026-11-17: kuniga 9 ta o'rniga 3 ta sifatli video (ko'p joylash ko'rishlarni pasaytirgan edi).
    # Toshkent vaqti (UTC+5): 07:30, 13:00, 21:00
    - cron: "30 2 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      faqat_test:
        description: "Faqat video yasash (Instagramga joylamasdan)"
        type: boolean
        default: true

concurrency:
  group: joyla
  cancel-in-progress: false

jobs:
  joyla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Agentni ishga tushirish
        run: python agent.py ${{ (github.event_name == 'workflow_dispatch' && inputs.faqat_test) && '--test' || '--now' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          VIDEO_REPO: ${{ secrets.VIDEO_REPO }}
          VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
      - name: Izohlarga javob yozish (faollik agenti)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.faqat_test) }}
        continue-on-error: true
        run: python faollik.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Videoni saqlab qo'yish (ko'rish uchun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: chiqish/*.mp4
          retention-days: 3
          if-no-files-found: ignore
