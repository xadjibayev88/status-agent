name: Subtitr yasash

on:
  workflow_dispatch:
    inputs:
      til:
        description: "Qo'shiq tili: uz, ru, en, tr (bo'sh = avtomatik)"
        type: string
        default: ""
      model:
        description: "Whisper modeli (large-v3 eng aniq, sekin)"
        type: choice
        default: large-v3
        options:
          - large-v3
          - medium
          - small
      vokal:
        description: "Avval vokalni ajratish (aniqroq, sekinroq)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  subtitr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}
      - name: Whisper o'rnatish
        run: pip install -r requirements.txt faster-whisper
      - name: Vokal ajratgich o'rnatish (ixtiyoriy)
        if: ${{ inputs.vokal }}
        continue-on-error: true
        run: |
          pip install "torch==2.5.1" "torchaudio==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          pip install demucs==4.0.1
      - name: Subtitr yasash
        env:
          WHISPER_TIL: ${{ inputs.til }}
          WHISPER_MODEL: ${{ inputs.model }}
          VOKAL: ${{ inputs.vokal && '1' || '0' }}
        run: python subtitr_yasa.py
      - name: .srt fayllarni repozitoriyga saqlash
        run: |
          git config user.name "subtitr-bot"
          git config user.email "subtitr-bot@users.noreply.github.com"
          git add -A -- '*.srt' || true
          if git diff --cached --quiet; then
            echo "Yangi .srt yo'q, saqlanadigan narsa yo'q."
          else
            git commit -m "Subtitrlar qo'shildi"
            git push
          fi
